<svg fill="none" viewBox="0 0 900 360" width="900" height="360" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        .terminal {
          background: #0a0a0f;
          border: 1px solid #1a1a2e;
          border-radius: 12px;
          overflow: hidden;
          font-family: 'JetBrains Mono', 'Courier New', monospace;
          box-shadow: 0 0 40px rgba(124, 58, 237, 0.08), 0 0 80px rgba(6, 182, 212, 0.04);
        }

        .titlebar {
          background: linear-gradient(90deg, #0f0f1a 0%, #12121f 100%);
          padding: 10px 16px;
          display: flex;
          align-items: center;
          gap: 8px;
          border-bottom: 1px solid #1a1a2e;
        }

        .dot { width: 12px; height: 12px; border-radius: 50%; }
        .dot-red { background: #ff5f57; }
        .dot-yellow { background: #febc2e; }
        .dot-green { background: #28c840; }

        .titlebar-text {
          color: #4a4a6a;
          font-size: 11px;
          margin-left: 8px;
          letter-spacing: 0.5px;
        }

        .body {
          padding: 24px 28px;
          display: flex;
          gap: 32px;
        }

        .left { flex: 1; }
        .right { flex: 1; }

        .prompt { color: #7c3aed; font-size: 13px; }
        .cmd { color: #06b6d4; font-size: 13px; }
        .output { color: #8b8baa; font-size: 12px; line-height: 1.8; margin-top: 8px; }
        .highlight { color: #a78bfa; font-weight: 700; }
        .cyan { color: #06b6d4; }
        .green { color: #34d399; }
        .yellow { color: #fbbf24; }
        .white { color: #e2e2f0; }
        .dim { color: #4a4a6a; }

        .name {
          font-size: 28px;
          font-weight: 700;
          background: linear-gradient(135deg, #a78bfa, #06b6d4);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
          background-clip: text;
          margin-bottom: 4px;
          animation: glow 3s ease-in-out infinite alternate;
        }

        @keyframes glow {
          from { filter: drop-shadow(0 0 2px rgba(167, 139, 250, 0.3)); }
          to { filter: drop-shadow(0 0 8px rgba(6, 182, 212, 0.4)); }
        }

        .tagline {
          color: #6a6a8a;
          font-size: 12px;
          margin-bottom: 16px;
          font-style: italic;
        }

        .separator {
          border: none;
          height: 1px;
          background: linear-gradient(90deg, transparent, #2a2a4a, transparent);
          margin: 12px 0;
        }

        .stat-row {
          display: flex;
          justify-content: space-between;
          font-size: 12px;
          padding: 3px 0;
        }

        .stat-label { color: #6a6a8a; }
        .stat-value { color: #e2e2f0; }

        .bar-container {
          width: 100%;
          height: 4px;
          background: #1a1a2e;
          border-radius: 2px;
          margin-top: 4px;
          overflow: hidden;
        }

        .bar {
          height: 100%;
          border-radius: 2px;
          animation: fillBar 2s ease-out forwards;
        }

        .bar-go { 
          width: 0; 
          background: linear-gradient(90deg, #00add8, #06b6d4); 
          animation-delay: 0.5s;
        }
        .bar-cpp { 
          width: 0; 
          background: linear-gradient(90deg, #659ad2, #a78bfa); 
          animation-delay: 0.8s;
        }
        .bar-py { 
          width: 0; 
          background: linear-gradient(90deg, #3776ab, #fbbf24); 
          animation-delay: 1.1s;
        }

        @keyframes fillBar {
          to { width: 100%; }
        }

        .cursor-blink {
          display: inline-block;
          width: 8px;
          height: 14px;
          background: #7c3aed;
          animation: blink 1s step-end infinite;
          vertical-align: middle;
          margin-left: 2px;
        }

        @keyframes blink {
          50% { opacity: 0; }
        }

        .status-dot {
          display: inline-block;
          width: 7px;
          height: 7px;
          border-radius: 50%;
          background: #34d399;
          animation: pulse 2s ease-in-out infinite;
          margin-right: 6px;
          vertical-align: middle;
        }

        @keyframes pulse {
          0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(52, 211, 153, 0.4); }
          50% { opacity: 0.7; box-shadow: 0 0 0 4px rgba(52, 211, 153, 0); }
        }

        .fade-in {
          animation: fadeIn 0.8s ease-out forwards;
          opacity: 0;
        }

        .delay-1 { animation-delay: 0.2s; }
        .delay-2 { animation-delay: 0.4s; }
        .delay-3 { animation-delay: 0.6s; }
        .delay-4 { animation-delay: 0.8s; }
        .delay-5 { animation-delay: 1.0s; }
        .delay-6 { animation-delay: 1.2s; }

        @keyframes fadeIn {
          to { opacity: 1; }
        }
      </style>

      <div class="terminal">
        <div class="titlebar">
          <div class="dot dot-red"></div>
          <div class="dot dot-yellow"></div>
          <div class="dot dot-green"></div>
          <span class="titlebar-text">nithwin@github ~ /home/nithwin</span>
        </div>

        <div class="body">
          <div class="left">
            <div class="fade-in delay-1">
              <span class="prompt">❯ </span><span class="cmd">whoami</span><span class="cursor-blink"></span>
            </div>

            <div class="fade-in delay-2" style="margin-top: 16px;">
              <div class="name">Nithwin V M</div>
              <div class="tagline">"I build systems, not just software."</div>
            </div>

            <hr class="separator fade-in delay-3" />

            <div class="output fade-in delay-3">
              <span class="highlight">→</span> Backend &amp; Systems Engineer<br/>
              <span class="highlight">→</span> Open Source Developer<br/>
              <span class="highlight">→</span> IEEE Xplore Published Author<br/>
              <span class="highlight">→</span> <span class="yellow">800+</span> LeetCode Problems Solved<br/>
              <span class="highlight">→</span> CS Graduate <span class="dim">2026</span>
            </div>

            <hr class="separator fade-in delay-4" />

            <div class="fade-in delay-5" style="font-size: 12px;">
              <span class="status-dot"></span>
              <span class="green">open to collaborate</span>
              <span class="dim"> · </span>
              <span class="cyan">open source contributor</span>
            </div>
          </div>

          <div class="right">
            <div class="fade-in delay-3">
              <div class="output" style="margin-top: 0;">
                <span class="prompt">❯ </span><span class="cmd">cat skills.conf</span>
              </div>
              <div style="margin-top: 12px;">
                <div class="stat-row">
                  <span class="stat-label">systems</span>
                  <span class="cyan">Go · C++ · Linux</span>
                </div>
                <div class="stat-row">
                  <span class="stat-label">cloud</span>
                  <span class="cyan">GCP · Docker · K8s</span>
                </div>
                <div class="stat-row">
                  <span class="stat-label">backend</span>
                  <span class="cyan">Node · Express · PostgreSQL</span>
                </div>
                <div class="stat-row">
                  <span class="stat-label">ai</span>
                  <span class="cyan">LLMs · RAG · MCP · LangChain</span>
                </div>
                <div class="stat-row">
                  <span class="stat-label">frontend</span>
                  <span class="cyan">React · Next.js · TypeScript</span>
                </div>
              </div>
            </div>

            <hr class="separator fade-in delay-4" />

            <div class="fade-in delay-5">
              <div class="output" style="margin-top: 0;">
                <span class="prompt">❯ </span><span class="cmd">cat languages.log</span>
              </div>
              <div style="margin-top: 10px;">
                <div class="stat-row">
                  <span class="stat-label">Go</span>
                  <span class="cyan">████████████████░░░░</span>
                </div>
                <div class="stat-row">
                  <span class="stat-label">C++</span>
                  <span class="highlight">█████████████░░░░░░░</span>
                </div>
                <div class="stat-row">
                  <span class="stat-label">Python</span>
                  <span class="yellow">███████████░░░░░░░░░</span>
                </div>
                <div class="stat-row">
                  <span class="stat-label">TypeScript</span>
                  <span class="green">████████░░░░░░░░░░░░</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
