<svg fill="none" viewBox="0 0 900 200" width="900" height="200" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        .grid {
          display: flex;
          gap: 12px;
          font-family: 'JetBrains Mono', monospace;
        }

        .card {
          flex: 1;
          background: #0a0a0f;
          border: 1px solid #1a1a2e;
          border-radius: 10px;
          padding: 16px 18px;
          transition: border-color 0.3s;
          position: relative;
          overflow: hidden;
          animation: slideUp 0.6s ease-out forwards;
          opacity: 0;
        }

        .card:nth-child(1) { animation-delay: 0.1s; }
        .card:nth-child(2) { animation-delay: 0.3s; }
        .card:nth-child(3) { animation-delay: 0.5s; }

        @keyframes slideUp {
          from { transform: translateY(10px); opacity: 0; }
          to { transform: translateY(0); opacity: 1; }
        }

        .card::before {
          content: '';
          position: absolute;
          top: 0;
          left: 0;
          right: 0;
          height: 2px;
          border-radius: 10px 10px 0 0;
        }

        .card:nth-child(1)::before { background: linear-gradient(90deg, #00add8, #06b6d4); }
        .card:nth-child(2)::before { background: linear-gradient(90deg, #7c3aed, #a78bfa); }
        .card:nth-child(3)::before { background: linear-gradient(90deg, #f97316, #fbbf24); }

        .card-icon { font-size: 18px; margin-bottom: 8px; }

        .card-title {
          font-size: 13px;
          font-weight: 700;
          color: #e2e2f0;
          margin-bottom: 4px;
        }

        .card-desc {
          font-size: 10px;
          color: #6a6a8a;
          line-height: 1.6;
          margin-bottom: 10px;
        }

        .card-tags {
          display: flex;
          flex-wrap: wrap;
          gap: 4px;
        }

        .tag {
          font-size: 9px;
          padding: 2px 8px;
          border-radius: 4px;
          background: #12121f;
          border: 1px solid #1a1a2e;
        }

        .tag-go { color: #06b6d4; border-color: #06b6d422; }
        .tag-ai { color: #a78bfa; border-color: #a78bfa22; }
        .tag-k8s { color: #326ce5; border-color: #326ce522; }
        .tag-next { color: #e2e2f0; border-color: #e2e2f022; }
        .tag-ws { color: #34d399; border-color: #34d39922; }
        .tag-cv { color: #fbbf24; border-color: #fbbf2422; }
        .tag-cpp { color: #659ad2; border-color: #659ad222; }
        .tag-docker { color: #2496ed; border-color: #2496ed22; }
        .tag-ieee { color: #f97316; border-color: #f9731622; }
      </style>

      <div class="grid">
        <div class="card">
          <div class="card-icon">⚡</div>
          <div class="card-title">WindMist</div>
          <div class="card-desc">Autonomous AI coding assistant with RAG engine, MCP sub-agents, and Telegram remote control</div>
          <div class="card-tags">
            <span class="tag tag-go">Go</span>
            <span class="tag tag-ai">RAG</span>
            <span class="tag tag-ai">MCP</span>
            <span class="tag tag-docker">Docker</span>
          </div>
        </div>

        <div class="card">
          <div class="card-icon">🛡️</div>
          <div class="card-title">ShadowCoders</div>
          <div class="card-desc">Anti-cheating exam platform serving 400+ users with real-time WebSocket sync &amp; AI grading</div>
          <div class="card-tags">
            <span class="tag tag-next">Next.js</span>
            <span class="tag tag-ws">Socket.IO</span>
            <span class="tag tag-ai">Gemini</span>
          </div>
        </div>

        <div class="card">
          <div class="card-icon">🔬</div>
          <div class="card-title">CA-YOLOv8</div>
          <div class="card-desc">Custom attention-based object detection model — published in IEEE Xplore 2025</div>
          <div class="card-tags">
            <span class="tag tag-cv">Python</span>
            <span class="tag tag-cv">YOLOv8</span>
            <span class="tag tag-ieee">IEEE</span>
          </div>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
