<svg fill="none" viewBox="0 0 900 65" width="900" height="65" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        .bar {
          display: flex;
          align-items: center;
          justify-content: center;
          gap: 14px;
          background: #0a0a0f;
          border: 1px solid #1a1a2e;
          border-radius: 10px;
          padding: 14px 24px;
          font-family: 'JetBrains Mono', monospace;
          animation: fadeIn 1s ease-out forwards;
        }

        @keyframes fadeIn {
          from { opacity: 0; transform: translateY(5px); }
          to { opacity: 1; transform: translateY(0); }
        }

        .divider {
          width: 1px;
          height: 20px;
          background: #1a1a2e;
        }

        .item {
          display: flex;
          align-items: center;
          gap: 6px;
          font-size: 11px;
          color: #6a6a8a;
          text-decoration: none;
        }

        .item-icon { font-size: 14px; }

        .item-label { color: #8b8baa; }
        .item-value { color: #a78bfa; font-weight: 700; }
        .item-value-cyan { color: #06b6d4; font-weight: 700; }
        .item-value-green { color: #34d399; font-weight: 700; }
        .item-value-yellow { color: #fbbf24; font-weight: 700; }

        .status-dot {
          width: 6px;
          height: 6px;
          border-radius: 50%;
          background: #34d399;
          animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
          0%, 100% { box-shadow: 0 0 0 0 rgba(52, 211, 153, 0.4); }
          50% { box-shadow: 0 0 0 4px rgba(52, 211, 153, 0); }
        }
      </style>

      <div class="bar">
        <div class="item">
          <span class="item-icon">📍</span>
          <span class="item-label">Tamil Nadu, India</span>
        </div>
        <div class="divider"></div>
        <div class="item">
          <span class="item-icon">🎓</span>
          <span class="item-label">CS</span>
          <span class="item-value">2026</span>
        </div>
        <div class="divider"></div>
        <div class="item">
          <span class="item-icon">🧠</span>
          <span class="item-label">LeetCode</span>
          <span class="item-value-yellow">800+</span>
        </div>
        <div class="divider"></div>
        <div class="item">
          <span class="item-icon">📄</span>
          <span class="item-label">IEEE</span>
          <span class="item-value-cyan">Published</span>
        </div>
        <div class="divider"></div>
        <div class="item">
          <div class="status-dot"></div>
          <span class="item-value-green">open to opportunities</span>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
